name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate Stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate SVGs
        run: |
          mkdir -p output

          curl -L \
            "https://github-readme-stats.vercel.app/api?username=Nicolaszz0708&hide_title=false&hide_rank=true&show_icons=true&include_all_commits=false&count_private=true&disable_animations=false&theme=midnight-purple&locale=en&hide_border=true&order=1" \
            -o output/stats.svg

          curl -L \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Nicolaszz0708&locale=en&hide_title=false&layout=compact&card_width=320&langs_count=5&theme=midnight-purple&hide_border=true&order=2" \
            -o output/languages.svg

      - name: Publish SVGs
        run: |
          git fetch origin stats-output || true

          if git show-ref --verify --quiet refs/remotes/origin/stats-output; then
            git checkout -B stats-output origin/stats-output
          else
            git checkout --orphan stats-output
            git rm -rf . || true
          fi

          cp -r output/* .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.svg languages.svg

          git commit -m "Update GitHub stats" || echo "No changes to commit"

          git push origin stats-output --force
